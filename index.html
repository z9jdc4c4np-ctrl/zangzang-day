<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zangzang's day</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f6cfe0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== 视图容器（单页四屏：同一 HTML 内切换显示） ===== */
  .view {
    position: fixed;
    inset: 0;
    display: none;
    overflow: hidden;
  }
  .view.active { display: block; }

  /* ================= 视图1：首页（封面页） ================= */
  #view-home { background: #f6cfe0; }

  /* 封面背景 contain，保证小猫与茶杯完整可见 */
  #view-home .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
    pointer-events: none;
  }

  /* 舞台：与封面图 contain 后的实际显示区域完全重合，内部按封面原图像素百分比定位 */
  #stage {
    position: absolute;
  }

  /* 素材为白底，正片叠底后白底在粉色封面上隐形 */
  #view-home .hotspot {
    position: absolute;
    cursor: pointer;
    mix-blend-mode: multiply;
  }
  #view-home .hotspot img {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* ===== 各素材：完整画框在舞台中的位置 =====
     封面图原始尺寸 2732 x 1536                                        */

  /* 茶杯3（顶层，带热气，把手在左）：正常1 C4 */
  #cup3 {
    left: -20.05%; top: -5.94%; width: 138.20%; height: 132.99%;
    clip-path: inset(32.12% 50.00% 55.15% 36.36%);
    transform-origin: 43.18% 44.85%;
  }
  /* 茶杯2（中层，横倾，把手在右）：低音6 A3 */
  #cup2 {
    left: -18.59%; top: -12.49%; width: 135.13%; height: 144.10%;
    clip-path: inset(39.39% 48.18% 49.09% 37.73%);
    transform-origin: 44.78% 50.91%;
  }
  /* 茶杯1（底层，带杯碟，把手在右）：低音5 G3 */
  #cup1 {
    left: -14.44%; top: -21.08%; width: 125.40%; height: 158.15%;
    clip-path: inset(46.67% 47.27% 38.18% 37.73%);
    transform-origin: 45.23% 61.82%;
  }
  /* 小猫剪影（画面左侧叠杯上的幼豹）：低音7 B3 —— 同时是去录音页的入口 */
  #cat {
    left: -2.12%; top: -13.33%; width: 104.03%; height: 145.62%;
    clip-path: inset(34.55% 33.64% 38.18% 50.00%);
    transform-origin: 58.18% 61.82%;
  }

  /* ===== 点击摇晃动效（茶杯与小猫） ===== */
  @keyframes shakeCup {
    0%   { transform: rotate(0deg); }
    18%  { transform: rotate(-7deg); }
    38%  { transform: rotate(6deg); }
    58%  { transform: rotate(-4.5deg); }
    78%  { transform: rotate(2.5deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes shakeCat {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(-4deg); }
    50%  { transform: rotate(4deg); }
    75%  { transform: rotate(-2deg); }
    100% { transform: rotate(0deg); }
  }
  .hotspot.shaking-cup { animation: shakeCup .55s ease-in-out; }
  .hotspot.shaking-cat { animation: shakeCat .55s ease-in-out; }

  /* ============================================================
     首页点击热区（透明，z-index 60 高于素材层）
     现在只有「小猫剪影」会跳转到录音页；
     小豹子幼崽和三个茶杯都只发声、不跳页。
     ============================================================ */
  /* 小豹子：最上面那只茶杯里探出头的狮子幼崽（照片抠图，带粉色描边）
     幼崽面孔在封面图 x 约 1125~1567 / y 约 566~800。
     （注意别和叠杯右侧那个深棕色小猫剪影搞混：剪影在 x 1363~1828 / y 568~1178，
       是另一个元素，不属于幼崽本体。）
     热区只覆盖幼崽的脸：x 1180~1520 / y 560~770，
     中心 (1350, 665) = 舞台 49.41% / 43.29%，大小 12.5% x 13.7%。
     底边特意收在 y 770（幼崽脸颊下缘），不再往下伸进茶杯 ——
     之前伸到 y 802 时会把下面那只茶杯吃掉，点它会响低音7 而不是中音1。
     热区是纯透明的，没有任何边框/描边/阴影 —— 看不到框线，只有点中幼崽才响。
     它 z-index 高于 #cat，点击命中的是这里，所以发声写在它的处理函数里；
     只发“低音7”，不做任何跳转。 */
  #goRecord {
    position: absolute;
    left: 49.41%; top: 43.29%;
    width: 12.5%; height: 13.7%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    border: none;
    background: none;
    box-shadow: none;
    z-index: 60;
    -webkit-tap-highlight-color: transparent;
  }
  /* 不给任何 hover/active 的可见反馈（否则会像截图里那样显出一个白框） */
  #goRecord:hover, #goRecord:active {
    border: none;
    background: none;
    box-shadow: none;
  }

  /* Zangzang's day 标题：紧贴标题文字的一整行，整行任意位置都可点
     实测标题墨迹在封面图 x 326~2169 / y 288~375
     （即 11.93%~79.40% / 18.75%~24.41%），四周各留一点余量。
     热区特意不做得更高/更宽，否则会盖住下方可点的茶杯与左侧的小豹子 */
  #goPolaroid {
    position: absolute;
    left: 11%; top: 18.1%;
    width: 69.5%; height: 7.2%;
    transform: none;
    cursor: pointer;
    border-radius: 14px;
    z-index: 60;
    transition: box-shadow .2s ease, background .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #goPolaroid:hover {
    background: rgba(255,255,255,.14);
    box-shadow: inset 0 0 40px rgba(255,255,255,.22);
  }
  #goPolaroid:active { background: rgba(255,255,255,.28); }

  /* ===== 提示与音乐开关（全局） ===== */
  #hint {
    position: fixed;
    left: 50%;
    bottom: 4.5%;
    transform: translateX(-50%);
    z-index: 95;
    padding: 9px 20px;
    border-radius: 999px;
    background: rgba(255, 245, 250, .72);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: #7c5a52;
    font-size: 13px;
    letter-spacing: 1.5px;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(150, 90, 110, .18);
    transition: opacity .6s ease, transform .6s ease;
    pointer-events: none;
  }
  #hint.show { opacity: 1; }
  #hint.hide { opacity: 0; transform: translateX(-50%) translateY(10px); }

  .musicBtn {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 100;
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 245, 250, .8);
    box-shadow: 0 4px 14px rgba(150, 90, 110, .2);
    color: #8a6259;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s ease;
  }
  .musicBtn:active { transform: scale(.9); }

  /* 音符飘出的小反馈 */
  .note-float {
    position: fixed;
    z-index: 96;
    pointer-events: none;
    font-size: 20px;
    color: #8a6259;
    text-shadow: 0 1px 4px rgba(255,255,255,.9);
    animation: floatUp .9s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(6px) scale(.8); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-42px) scale(1.1); }
  }

  /* ================= 视图2：录音页 ================= */
  #view-record { background: #000; }
  /* 画布：按底图比例 2732:1537 缩放铺满屏幕 */
  #recordStage {
    position: relative;
    width: min(100vw, calc(100vh * 2732 / 1537));
    height: min(100vh, calc(100vw * 1537 / 2732));
    margin: 0 auto;
    /* 底图不写在 CSS 里，改成切到本页时用 JS 按需加载（见 showView） */
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
  }
  /* 图标：透明底，百分比定位，正方形 */
  .icon {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 8.2%;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    transition: transform 0.18s ease, filter 0.18s ease;
  }
  .icon:hover {
    transform: translate(-50%, -50%) scale(1.12);
    filter: brightness(1.06);
  }
  .icon:active {
    transform: translate(-50%, -50%) scale(0.92);
  }
  .icon .ripple {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 10%;
    height: 10%;
    transform: translate(-50%, -50%);
    border: 3px solid rgba(255, 214, 132, 0.9);
    border-radius: 30%;
    opacity: 0;
    pointer-events: none;
  }
  .icon.play .ripple {
    animation: ripple 0.6s ease-out forwards;
  }
  @keyframes ripple {
    0%   { width: 10%; height: 10%; opacity: 0.9; }
    100% { width: 170%; height: 170%; opacity: 0; }
  }

  /* 录音页返回键：位于画面最左下角（“土豆”图标下方）
     底图左下角实测占位：
       土豆  x 2.42~10.62  y 65.44~80.02
       sugar x 17.86~26.06 y 82.00~96.58
     它们下方这块是空的，所以返回热区放在 x 1.5~12.5 / y 88.7~94.3：
       中心 7% / 91.5%，11% x 5.6%，左右各留一点边
     热区是纯透明的（无底框、无背景、无描边），只负责点击返回首页。
     （白色“Back”在粉色豹纹底上对比度极低，无法用像素阈值取字形边界；
       这里按底图排版落点定位，并用点击测试确认热区内每一点都可点。） */
  #goHome {
    position: absolute;
    left: 7%;
    top: 91.5%;
    width: 11%;
    height: 5.6%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    border-radius: 999px;
    background: none;
    border: none;
    box-shadow: none;
    z-index: 75;
    transition: transform .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #goHome:hover {
    transform: translate(-50%, -50%) scale(1.06);
  }
  #goHome:active {
    transform: translate(-50%, -50%) scale(.96);
  }

  /* 提示浮层 */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 9%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30, 22, 40, 0.86);
    color: #ffe9c9;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 16px;
    letter-spacing: 1px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 99;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ================= 视图3：拍立得页 ================= */
  #view-polaroid { background: #000; }
  #view-polaroid .bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    pointer-events: none;
  }
  /* 导航热区：右侧蓝色拍立得 → 拍立得副页（cover 坐标由 JS 映射） */
  #navLayer {
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
  }
  #navPolaroid {
    position: absolute;
    cursor: pointer;
    pointer-events: auto;
    border-radius: 14px;
    transition: box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #navPolaroid:hover {
    box-shadow: inset 0 0 40px rgba(255,255,255,.20), 0 0 24px rgba(255,255,255,.14);
  }
  #navPolaroid:active { box-shadow: inset 0 0 40px rgba(255,255,255,.4); }

  /* ================= 视图4：拍立得副页 ================= */
  #view-collage {
    background: #000;
    overflow-y: auto;
  }
  #view-collage .bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    pointer-events: none;
  }
  /* 拼贴墙容器：照片绝对定位，纵向瀑布流叠加 */
  #wall {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 20px 140px;
    min-height: 100vh;
  }
  .card {
    position: absolute;
    border-radius: 10px;
    overflow: hidden;
    cursor: zoom-in;
    background: #fff;
    padding: 8px 8px 30px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .38);
    transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
  }
  .card::after {
    content: '♥';
    position: absolute;
    left: 50%;
    bottom: 6px;
    transform: translateX(-50%);
    font-size: 13px;
    color: rgba(180, 120, 130, .55);
  }
  .card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 4px;
    pointer-events: none;
  }
  .card:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
    z-index: 9999 !important;
  }
  .card.topmost {
    box-shadow: 0 0 0 4px rgba(255, 214, 132, .95), 0 0 28px rgba(255, 214, 132, .6) !important;
    transform: scale(1.06) !important;
    z-index: 99999 !important;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  /* “下一张”按钮 */
  #nextBtn {
    position: fixed;
    right: 18px;
    bottom: 76px;
    z-index: 90;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    background: rgba(255, 245, 250, .88);
    box-shadow: 0 4px 16px rgba(150, 90, 110, .3);
    color: #8a6259;
    font-size: 15px;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: transform .2s ease, background .2s ease;
  }
  #nextBtn:active { transform: scale(.93); }

  /* 副页右下角星星 → 首页
     星星按像素实测在底图 x 2542~2692 / y 1330~1473，中心 (2629,1388)
     = 96.23% / 90.31%，位置极靠边，16:9 屏幕上会被 cover 裁到视口外；
     所以位置由 JS 按底图坐标算出来后夹进视口，并让开右下角的
     “下一张”与 ♪，保证始终看得见、点得到 */
  #goHomeStar {
    position: fixed;
    z-index: 89;
    cursor: pointer;
    border-radius: 50%;
    transition: box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #goHomeStar:hover {
    box-shadow: inset 0 0 30px rgba(255,255,255,.25), 0 0 22px rgba(255,255,255,.18);
  }
  #goHomeStar:active { box-shadow: inset 0 0 30px rgba(255,255,255,.5); }

  /* ===== 原图灯箱（全局最顶层） ===== */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .2);
    cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 8px;
    box-shadow: 0 10px 50px rgba(0, 0, 0, .55);
    animation: zoomIn .25s ease-out;
    cursor: default;
  }
  @keyframes zoomIn {
    from { transform: scale(.85); opacity: .4; }
    to   { transform: scale(1); opacity: 1; }
  }
  #lightbox .close {
    position: fixed;
    top: 18px;
    right: 20px;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, .3);
    color: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    z-index: 201;
    transition: background .2s ease, transform .2s ease;
  }
  #lightbox .close:hover { background: rgba(255, 255, 255, .5); }
  #lightbox .close:active { transform: scale(.9); }

  @media (max-width: 600px) {
    #hint { font-size: 12px; padding: 7px 15px; }
    .musicBtn { width: 42px; height: 42px; font-size: 18px; }
    #wall { padding: 40px 10px 130px; }
    #nextBtn { padding: 10px 16px; font-size: 13px; right: 12px; bottom: 68px; }
  }
</style>
</head>
<body>

  <!-- ================= 视图1：首页 ================= -->
  <section class="view active" id="view-home">
    <img class="bg" src="封面页.jpg" alt="Zangzang's day 封面">
    <div id="stage">
      <!-- 叠放顺序：底层杯 -> 中层杯 -> 顶层杯 -> 小猫 -->
      <div class="hotspot" id="cup1" data-note="G3" data-name="低音5" title="低音 5">
        <img src="茶杯1.PNG" alt="茶杯1">
      </div>
      <div class="hotspot" id="cup2" data-note="A3" data-name="低音6" title="低音 6">
        <img src="茶杯2.PNG" alt="茶杯2">
      </div>
      <div class="hotspot" id="cup3" data-note="C4" data-name="1" title="中音 1">
        <img src="茶杯3.PNG" alt="茶杯3">
      </div>
      <div class="hotspot" id="cat" data-note="B3" data-name="低音7" title="小豹子 · 去录音页">
        <img src="小猫.PNG" alt="小猫剪影">
      </div>

      <!-- 跳转热区：小豹子 → 录音页；Zangzang's day 标题 → 拍立得页 -->
      <div id="goRecord" title="去录音页"></div>
      <div id="goPolaroid" title="去拍立得页"></div>
    </div>
    <div id="hint" class="show">轻触页面开启音乐 · 点一点茶杯，点小豹子听录音</div>
    <button class="musicBtn" id="musicBtnHome" title="背景音乐开关" aria-label="背景音乐开关">♪</button>
  </section>

  <!-- ================= 视图2：录音页 ================= -->
  <section class="view" id="view-record">
    <div id="recordStage">
      <!-- 返回键：左下角透明热区 → 首页（无可见底框，只负责点击） -->
      <div id="goHome" title="返回首页" role="button" aria-label="返回首页"></div>
    </div>
    <div id="toast"></div>
    <button class="musicBtn" id="musicBtnRecord" title="背景音乐开关" aria-label="背景音乐开关">♪</button>
  </section>

  <!-- ================= 视图3：拍立得页 ================= -->
  <section class="view" id="view-polaroid">
    <img class="bg" data-src="拍立得页.jpg" alt="拍立得页">
    <div id="navLayer">
      <div id="navPolaroid" title="进入照片墙"></div>
    </div>
    <button class="musicBtn" id="musicBtnPolaroid" title="背景音乐开关" aria-label="背景音乐开关">♪</button>
  </section>

  <!-- ================= 视图4：拍立得副页 ================= -->
  <section class="view" id="view-collage">
    <img class="bg" data-src="拍立得副页.jpg" alt="拍立得副页">
    <div id="wall"></div>
    <!-- 右下角星星 → 首页 -->
    <div id="goHomeStar" title="返回首页"></div>
    <button id="nextBtn" title="下一张被遮挡的照片">下一张 ▾</button>
    <button class="musicBtn" id="musicBtnCollage" title="背景音乐开关" aria-label="背景音乐开关">♪</button>
  </section>

  <!-- ===== 灯箱（全局最顶层） ===== -->
  <div id="lightbox">
    <img id="lightboxImg" src="" alt="照片原图">
    <button class="close" id="lightboxClose" title="关闭" aria-label="关闭">×</button>
  </div>

<script>
(function () {
  'use strict';

  /* ============================================================
     视图切换（单页四屏）
       首页 --小豹子--> 录音页 --左下角 Back--> 首页
       首页 --Zangzang's day 标题--> 拍立得页 --蓝色拍立得--> 拍立得副页 --右下角星星--> 首页
     ============================================================ */
  var VIEWS = ['home', 'record', 'polaroid', 'collage'];
  var currentView = 'home';

  var bgLoaded = {};

  var BG_W = 2732, BG_H = 1536;

  /* ============================================================
     全局背景音乐（摇篮曲，Web Audio 合成，首页/录音页/拍立得页共用）
     ============================================================ */
  var ctx = null, masterGain, musicBus;
  var musicOn = true;
  var musicStarted = false;
  var musicTimer = null;

  function initAudio() {
    if (ctx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    masterGain = ctx.createGain();
    masterGain.gain.value = 0.9;
    masterGain.connect(ctx.destination);

    musicBus = ctx.createGain();
    musicBus.gain.value = 0.5;
    musicBus.connect(masterGain);
    return true;
  }

  var BPM = 63;
  var STEP = 60 / BPM / 2;
  var MELODY = [
    'C4','E4','G4','E4', 'A4','G4','E4','D4',
    'F4','A4','C5','A4', 'G4','E4','D4','E4',
    'D4','F4','A4','F4', 'G4','E4','C4','-1',
    'G3','B3','D4','G4', 'E4','D4','C4','-1'
  ];
  var MF = {
    G3:196.00, A3:220.00, B3:246.94, C4:261.63, D4:293.66,
    E4:329.63, F4:349.23, G4:392.00, A4:440.00, C5:523.25
  };
  var BASS = ['C3','C3','F3','F3','G3','G3','C3','Am'];
  var BF = { C3:130.81, F3:174.61, G3:196.00, A2:110.00 };

  var melodyIndex = 0, nextNoteTime = 0;

  function padNote(freq, t, dur, vol) {
    var o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    var o2 = ctx.createOscillator();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(freq * 2, t);
    var g2 = ctx.createGain(); g2.gain.value = 0.08;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.08);
    g.gain.setValueAtTime(vol, t + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(musicBus);
    o.start(t); o2.start(t);
    o.stop(t + dur + .05); o2.stop(t + dur + .05);
  }

  function scheduleMusic() {
    if (!ctx || !musicOn) return;
    while (nextNoteTime < ctx.currentTime + 0.9) {
      var i = melodyIndex;
      var note = MELODY[i % MELODY.length];
      var t = nextNoteTime;
      if (note !== '-1') padNote(MF[note], t, STEP * 1.9, 0.13);

      if (i % 4 === 0) {
        var b = BASS[Math.floor(i / 4) % BASS.length];
        if (b !== 'Am') padNote(BF[b], t, STEP * 3.8, 0.10);
        else {
          padNote(BF.A2, t, STEP * 3.8, 0.08);
          padNote(BF.C3 * 1.5, t, STEP * 3.8, 0.06);
        }
      }
      nextNoteTime += STEP;
      melodyIndex++;
    }
    musicTimer = setTimeout(scheduleMusic, 200);
  }

  function startMusic() {
    if (!initAudio() || musicStarted) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (ctx.state !== 'running') return;
    musicStarted = true;
    musicOn = true;
    nextNoteTime = ctx.currentTime + 0.08;
    scheduleMusic();
    syncMusicBtns();
  }

  function setMusicBus(on) {
    musicOn = on;
    if (!ctx) return;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(on ? 0.5 : 0.0001, ctx.currentTime + 0.25);
    if (on && musicStarted) {
      clearTimeout(musicTimer);
      if (ctx.state === 'suspended') ctx.resume();
      nextNoteTime = Math.max(nextNoteTime, ctx.currentTime + 0.05);
      scheduleMusic();
    }
  }

  /* ============================================================
     副页背景音乐：特别的人伴奏.mp3（切到副页才播放）
     注意：这个文件有 9.9MB，是整站最大的一块。
     以前写成 preload='auto'，会让打开首页时就偷偷开始下载它，

  var mp3 = new Audio();

  var NOTE_FREQ = {

  function playTone(freq) {
    if (!initAudio()) return;
    if (ctx.state === 'suspended') ctx.resume();
    var t = ctx.currentTime, dur = 1.1;
    var o1 = ctx.createOscillator();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(freq, t);
    var o2 = ctx.createOscillator();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(freq * 2, t);
    var g2 = ctx.createGain();
    g2.gain.value = 0.12;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.025);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.18);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o1.connect(g);
    o2.connect(g2); g2.connect(g);
    g.connect(musicBus);
    o1.start(t); o2.start(t);
    o1.stop(t + dur + .05); o2.stop(t + dur + .05);
  }

  /* 录音播放时 BGM 自动调小（ducking），mp3 同步压低 */
  var DUCK_LEVEL = 0.10;

  function duckBgm() {
    if (!ctx) return;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(DUCK_LEVEL, ctx.currentTime + 0.15);
    if (!mp3.paused) mp3.volume = DUCK_LEVEL;

    playingAudios.delete(audio);

  var BG_W2 = 2732, BG_H2 = 1537;

  /* 在 cover 铺满的底图上放置热区：
     先按底图像素坐标算出贴纸在屏幕上的位置与大小，
     再整体平移进视口（贴纸不会被拉伸变形）。
     竖屏手机上底图两侧会被 cover 裁掉，若不平移，热区会整块跑到屏幕外点不到。 */
  function placeCoverHotspot(el, spot, minSize) {
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.max(vw / BG_W2, vh / BG_H2);
    var dw = BG_W2 * s, dh = BG_H2 * s;
    var ox = (vw - dw) / 2, oy = (vh - dh) / 2;

    /* 尺寸就取贴纸本身缩放后的大小，只做下限保护，不做额外放大，
       这样热区始终贴着贴纸，不会因为夹取而整体偏移 */
    var w = Math.max(minSize, spot.w * s);
    var h = Math.max(minSize, spot.h * s);

    var m = 6;
    var left = ox + (spot.cx - spot.w / 2) * s;
    var top  = oy + (spot.cy - spot.h / 2) * s;

    /* 先按贴纸原始位置摆放；只有超出视口时才整体平移回来 */
    if (left + w + m > vw) left = vw - m - w;
    if (left < m) left = m;
    if (top + h + m > vh) top = vh - m - h;
    if (top < m) top = m;

    el.style.left   = left + 'px';
    el.style.top    = top + 'px';
    el.style.width  = w + 'px';
    el.style.height = h + 'px';
  }

    });

    zTop += 1;
    lowest.el.style.zIndex = zTop;
    lowest.z = zTop;

    if (topmostEl) topmostEl.classList.remove('topmost');
    lowest.el.classList.add('topmost');
    topmostEl = lowest.el;

    var r = lowest.el.getBoundingClientRect();
    var sy = window.pageYOffset + r.top - window.innerHeight / 2 + r.height / 2;
    window.scrollTo({ top: Math.max(0, sy), behavior: 'smooth' });

    setTimeout(function () {
      lowest.el.classList.remove('topmost');
      if (topmostEl === lowest.el) topmostEl = null;
    }, 1600);
  });

  /* 灯箱 */
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');

  function openLightbox(name) {
    lightboxImg.src = name;
    lightbox.classList.add('open');
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  }
  document.getElementById('lightboxClose').addEventListener('click', function (e) {
    e.stopPropagation();
    closeLightbox();
  });
  lightbox.addEventListener('click', closeLightbox);
  lightboxImg.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });

  /* 副页右下角星星 → 首页
     星星按像素实测在底图 x 2542~2692 / y 1330~1473，中心 (2629,1388)
     = 96.23% / 90.31%（大小约 150x144，是个小星星）。
     它位置极靠边，16:9 屏幕上会被 cover 裁到视口外；所以由 JS 算出后
     夹进视口，并依次改用“抬到按钮上方 / 挪到按钮左侧 / 缩小”来让开
     右下角的“下一张”和 ♪，保证在任何屏幕比例下都完整可见且点得到 */
  var STAR = { cx: 2629, cy: 1388, size: 300 };
  var goHomeStar = document.getElementById('goHomeStar');

  function layoutStar() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.max(vw / BG_W2, vh / BG_H2);
    var dw = BG_W2 * s, dh = BG_H2 * s;
    var ox = (vw - dw) / 2, oy = (vh - dh) / 2;

    var size = Math.max(64, Math.min(STAR.size * s, vw * 0.26, vh * 0.26));
    var m = 6;
    var gap = 10;
    var cx = ox + STAR.cx * s;
    var cy = oy + STAR.cy * s;

    /* 夹在视口内，保证热区整体可点 */
    cx = Math.min(Math.max(cx, m + size / 2), vw - m - size / 2);
    cy = Math.min(Math.max(cy, m + size / 2), vh - m - size / 2);

    /* 右下角已经被“下一张”和 ♪ 占着，星星放不下就换位置：
       先试按钮左侧 → 再试按钮上方 → 最后按比例缩小硬塞在右下角，
       三种情况都保证星星完整落在屏幕内、且不与按钮重叠 */
    function collides(x, y, sz) {
      var boxes = [document.getElementById('nextBtn'),
                   document.querySelector('#view-collage .musicBtn')];
      for (var i = 0; i < boxes.length; i++) {
        if (!boxes[i]) continue;
        var r = boxes[i].getBoundingClientRect();
        if (x + sz / 2 + gap > r.left && x - sz / 2 - gap < r.right &&
            y + sz / 2 + gap > r.top  && y - sz / 2 - gap < r.bottom) return true;
      }
      return false;
    }
    var fits = function (x, y, sz) {
      return x - sz / 2 >= m && x + sz / 2 <= vw - m &&
             y - sz / 2 >= m && y + sz / 2 <= vh - m && !collides(x, y, sz);
    };

    if (!fits(cx, cy, size)) {
      var nb0 = document.getElementById('nextBtn');
      var mb0 = document.querySelector('#view-collage .musicBtn');
      var nR = nb0 ? nb0.getBoundingClientRect() : null;
      var mR = mb0 ? mb0.getBoundingClientRect() : null;
      var blockerTop = Math.min(nR ? nR.top : vh, mR ? mR.top : vh);
      var blockerLeft = Math.min(nR ? nR.left : vw, mR ? mR.left : vw);

      /* 右对齐后放进视口再判断，保证星星始终贴着右边 */
      var rightAligned = function (y, sz) {
        return Math.min(Math.max(cx, m + sz / 2), vw - m - sz / 2);
      };

      /* 1) 抬到两个按钮上方（仍然贴着屏幕右侧） */
      var y1 = blockerTop - gap - size / 2;
      if (fits(rightAligned(y1, size), y1, size)) {
        cy = y1;
        cx = rightAligned(y1, size);
      } else {
        /* 2) 挪到两个按钮左侧 */
        var x2 = blockerLeft - gap - size / 2;
        if (fits(x2, cy, size)) {
          cx = x2;
        } else {
          /* 3) 屏幕很窄：先缩小，再试上方，仍不行就缩小塞进右下角 */
          var sz = size;
          while (sz > 48 && !fits(rightAligned(y1, sz), y1, sz)) { sz -= 6; }
          if (sz > 48) {
            size = sz; cy = y1; cx = rightAligned(y1, sz);
          } else {
            for (var t = 0; t < 28 && !fits(cx, cy, size); t++) {
              size = Math.max(44, size - 6);
              cx = Math.min(Math.max(cx, m + size / 2), vw - m - size / 2);
              cy = Math.min(Math.max(cy, m + size / 2), vh - m - size / 2);
            }
          }
        }
      }
    }

    /* 兜底：夹回视口内 */
    cx = Math.min(Math.max(cx, m + size / 2), vw - m - size / 2);
    cy = Math.min(Math.max(cy, m + size / 2), vh - m - size / 2);

    goHomeStar.style.left = (cx - size / 2) + 'px';
    goHomeStar.style.top  = (cy - size / 2) + 'px';
    goHomeStar.style.width  = size + 'px';
    goHomeStar.style.height = size + 'px';
  }

  goHomeStar.addEventListener('click', function (e) {
    e.stopPropagation();
    showView('home');
  });

  /* ============================================================
     自适应布局（尺寸变化时重算所有热区）
     ============================================================ */
  function layoutAll() {
    layout();
    layoutNav();
    layoutStar();
  }
  window.addEventListener('resize', layoutAll);
  window.addEventListener('orientationchange', function () { setTimeout(layoutAll, 200); });

  /* ============================================================
     启动
     ============================================================ */
  layoutAll();

  /* 首次任意手势：兜底启动背景音乐 */
  document.addEventListener('pointerdown', function firstGesture() {
    if (!musicStarted) startMusic();
    if (currentView === 'collage' && !mp3Started && musicOn) {
      ensureMp3();
      var p = mp3.play();
      if (p && p.then) p.then(function () { mp3Started = true; }).catch(function () {});
    }
    hideHint();
  }, { once: true });

  try { startMusic(); } catch (err) {}
  setTimeout(function () { if (musicStarted) hideHint(); }, 1200);
})();
</script>
